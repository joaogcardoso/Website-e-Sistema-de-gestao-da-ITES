name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: CI / web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  server:
    name: CI / server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: server/pom.xml
      - run: ./mvnw --batch-mode verify
        working-directory: server

  deployment:
    name: CI / deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validar Compose
        env:
          DB_PASSWORD: ci-dummy-password
          AUTH_JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          AUTH_TOTP_ENCRYPTION_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
        run: docker compose config --quiet
      - name: Construir imagens
        env:
          DB_PASSWORD: ci-dummy-password
          AUTH_JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          AUTH_TOTP_ENCRYPTION_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
        run: docker compose build

  ci-success:
    name: CI / ci-success
    if: always()
    needs: [web, server, deployment]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir sucesso de todas as verificações
        env:
          WEB_RESULT: ${{ needs.web.result }}
          SERVER_RESULT: ${{ needs.server.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
        run: |
          test "$WEB_RESULT" = success
          test "$SERVER_RESULT" = success
          test "$DEPLOYMENT_RESULT" = success
